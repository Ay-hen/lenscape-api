# Local development profile:  SPRING_PROFILES_ACTIVE=dev
# - JWT key is generated at start-up when JWT_SECRET is not set (tokens stop working after a restart)
# - no Kafka broker needed: notifications are processed in-process
app.jwt.allow-ephemeral-secret=true
app.kafka.enabled=false
# E-mail verification without an SMTP account: codes are printed in the server log (WARN "DEV ONLY ..."), nothing is sent.
# Remove this line (or use another profile) to send real e-mail with MAIL_USERNAME / MAIL_PASSWORD.
app.otp.allow-ephemeral-secret=true
app.mail.log-only=${DEV_LOG_CODES:true}
