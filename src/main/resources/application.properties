# ---------------------------------------------------------------- MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:photography}
# needed for the unique/compound indexes declared on messages and notifications
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------- Security / JWT
# JWT_SECRET is REQUIRED (Base64, >= 32 bytes). Generate one:  openssl rand -base64 48
# There is intentionally no default: the key that used to be committed here was public and is refused at start-up.
# For local development only, SPRING_PROFILES_ACTIVE=dev generates a temporary random key instead.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---------------------------------------------------------------- E-mail verification (6-digit code sent at sign-up)
# OTP_HMAC_SECRET is REQUIRED (>= 32 chars) except with profile dev:  openssl rand -base64 48
app.otp.hmac-secret=${OTP_HMAC_SECRET:}
app.otp.ttl=${OTP_TTL:PT10M}
app.otp.max-failed-attempts=${OTP_MAX_FAILED_ATTEMPTS:5}
app.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:PT1M}
app.otp.max-sends-per-hour=${OTP_MAX_SENDS_PER_HOUR:5}
app.otp.pending-retention=${OTP_PENDING_RETENTION:PT24H}
# ---------------------------------------------------------------- Forgot password (6-digit code -> single-use reset token -> new password)
# Reuses OTP_HMAC_SECRET above. A recovery code protects an existing account, so it lives shorter than a sign-up code.
app.password-reset.otp-ttl=${PASSWORD_RESET_OTP_TTL:PT5M}
app.password-reset.reset-token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT10M}
app.password-reset.max-failed-attempts=${PASSWORD_RESET_MAX_FAILED_ATTEMPTS:5}
app.password-reset.resend-cooldown=${PASSWORD_RESET_RESEND_COOLDOWN:PT1M}
app.password-reset.max-sends-per-hour=${PASSWORD_RESET_MAX_SENDS_PER_HOUR:5}
app.password-reset.retention=${PASSWORD_RESET_RETENTION:PT24H}
# SMTP. Gmail: use an "app password" (Google account > Security > 2-Step Verification > App passwords), not your normal password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Sender address shown to the user (defaults to the SMTP username)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.log-only=false
app.brand-name=${APP_BRAND_NAME:Lenscape}

# ---------------------------------------------------------------- Platform
# Dates/times in bookings are local wall-clock values in this zone (notice windows, "today", past slots).
app.timezone=${APP_TIMEZONE:Africa/Casablanca}
# Public URL of THIS API (used to build links to uploaded images)
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
# Uploaded images are stored on local disk. Use a persistent volume in production (or replace UploadService with object storage).
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.max-bytes=8388608
# Optional bootstrap of the first administrator (created only if the username does not exist yet). Password >= 12 characters.
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.name=${APP_ADMIN_NAME:Administrator}

# JSON: ISO-8601 dates, omit null properties (the Angular models use optional fields)
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never

# Browser origins allowed for REST (CORS) AND for the WebSocket handshake. Comma separated, no trailing slash.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------------------------------------------------------------- Chat
app.chat.max-message-length=2000
# per-user sending limit (sliding window)
app.chat.rate-limit.messages=30
app.chat.rate-limit.window-seconds=60

# ---------------------------------------------------------------- Kafka (notification pipeline)
# false = no broker needed: events are processed in-process (handy for local dev / tests). true = Kafka.
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.notifications-topic=photography.notifications
app.kafka.consumer-group=photography-notifications
app.kafka.partitions=3
app.kafka.replicas=${KAFKA_REPLICAS:1}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Do not log message bodies
logging.level.org.springframework.web.socket=INFO

# ---------------------------------------------------------------- Profile completion
app.profile.min-portfolio-photos=${MIN_PORTFOLIO_PHOTOS:3}
app.profile-reminder.enabled=${PROFILE_REMINDER_ENABLED:true}
app.profile-reminder.first-delay=${PROFILE_REMINDER_FIRST_DELAY:P1D}
app.profile-reminder.interval=${PROFILE_REMINDER_INTERVAL:P7D}
app.profile-reminder.snooze=${PROFILE_REMINDER_SNOOZE:P3D}
app.profile-reminder.max-reminders=${PROFILE_REMINDER_MAX:6}
app.profile-reminder.dismiss-threshold=${PROFILE_REMINDER_DISMISS_THRESHOLD:80}
app.profile-reminder.check-interval-ms=${PROFILE_REMINDER_CHECK_MS:3600000}

# ---------------------------------------------------------------- 24 h booking reminder
app.booking-reminder.enabled=${BOOKING_REMINDER_ENABLED:true}
app.booking-reminder.lead=${BOOKING_REMINDER_LEAD:PT24H}
app.booking-reminder.grace=${BOOKING_REMINDER_GRACE:PT2H}
app.booking-reminder.interval-ms=${BOOKING_REMINDER_INTERVAL_MS:60000}